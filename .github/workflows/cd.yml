name: Continuous Deployment - Docker Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-interview-api:latest .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ai-interview-api:latest

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u Saubhik998 --password-stdin

      - name: Tag and push image to ghcr.io
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/ai-interview-api:latest ghcr.io/Saubhik998/ai-interview-api:latest
          docker push ghcr.io/Saubhik998/ai-interview-api:latest
