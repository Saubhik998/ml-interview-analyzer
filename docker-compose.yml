version: "3.8"

services:
  llm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-llm-api
    ports:
      - "8081:8081"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}   # Loads the Gemini API key from environment or .env file
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    external: true
